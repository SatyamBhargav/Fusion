name: fusion
description: Fusion — a playful, local-first password manager.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_secure_storage: '>=10.0.0 <12.0.0'
  google_fonts: '>=6.2.1 <10.0.0'
  flutter_svg: ^2.0.10
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.2
  local_auth: ^3.0.2
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#5B47F5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icon/app_icon_ios_dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/app_icon_ios_tinted.png"
  web:
    generate: true
    background_color: "#5B47F5"
    theme_color: "#5B47F5"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
